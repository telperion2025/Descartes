name: test

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 x64 builds are no longer published for Ubuntu 26.04;
          # 3.9 is still exercised on macOS (spec floor: Python >= 3.9).
          - os: ubuntu-latest
            python-version: ["3.10", "3.12"]
          - os: macos-latest
            python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux (Linux, for the tmux integration test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run test suite
        run: python -m pytest -q
