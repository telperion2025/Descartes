name: test

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:

jobs:
  pytest-ubuntu:
    name: pytest (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 x64 builds are no longer published for Ubuntu 26.04;
        # the 3.9 floor is exercised on macOS (spec: Python >= 3.9).
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux (for the tmux integration test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run test suite
        run: python -m pytest -q

  pytest-macos:
    name: pytest (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run test suite
        run: python -m pytest -q
