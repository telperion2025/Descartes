[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "descartes"
version = "1.0.0"
description = "Descartes 1-2-3 - a terminal clone of Lotus 1-2-3 Release 3.1 in Python 3 (curses)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
descartes = "descartes.__main__:main"

[tool.setuptools]
packages = ["descartes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
